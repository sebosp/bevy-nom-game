[package]
name = "bevy-nom-game"
authors = ["Seb Ospina <kraige@gmail.com>"]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Learn nom parser combinators: write the parser, watch the bytes it matches light up"
repository = "https://github.com/sebosp/bevy-nom-game"

[lib]
name = "nom_game"

[[bin]]
name = "bevy-nom-game"
path = "src/main.rs"

[dependencies]
bevy = { version = "0.20.0", default-features = false, features = ["ui", "bevy_state"] }
# The lexer of the player's parsers is itself written with nom.
nom = "8.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = { version = "0.4", features = ["max_level_debug", "release_max_level_warn"] }

# The file dialog: the desktops and the browser.
[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.17"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Copy and paste with the other programs; the browser keeps an in-memory clipboard.
bevy = { version = "0.20.0", default-features = false, features = ["system_clipboard"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Storage", "Document", "EventTarget", "Event", "DragEvent", "DataTransfer", "File", "FileList", "Blob"] }

[features]
default = []
# Bevy as a shared library for fast local builds, `cargo dev`. Not for the copied binaries.
dynamic = ["bevy/dynamic_linking"]

# Small optimization for our code, full optimization for the dependencies.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

# trunk build --release uses this profile for the browser build, see index.html.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"
